<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Password Reset OTP</title>
</head>
<body style="margin:0; padding:0; background-color:#0a0a0a; font-family:Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0a0a; padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background:#141414; border-radius:16px; overflow:hidden; border:1px solid #2a2a2a;">

          <!-- Header -->
          <tr>
            <td style="background:#ff1493; padding:32px 30px; text-align:center;">
              <div style="color:#000000; font-size:13px; letter-spacing:2px; text-transform:uppercase; opacity:0.85; margin-bottom:6px;">StreamVault</div>
              <h1 style="margin:0; color:#000000; font-size:22px; font-weight:800;">Password Reset</h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:36px 30px 10px 30px; color:#d4d4d4; line-height:1.6;">
              <p style="margin:0 0 6px 0; font-size:16px; color:#ffffff;">Hello #{name}</p>
              <p style="margin:0; font-size:15px; color:#b0b0b0;">
                Use the verification code below to reset your password.
              </p>
            </td>
          </tr>

          <!-- OTP -->
          <tr>
            <td style="padding:24px 30px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#1c1c1c; border-radius:12px;">
                <tr>
                  <td style="padding:24px; text-align:center;">
                    <div style="font-size:12px; letter-spacing:1px; text-transform:uppercase; color:#9a9a9a; margin-bottom:10px;">Your verification code</div>
                    <div style="font-size:38px; font-weight:700; letter-spacing:10px; color:#ff1493;">#{otp}</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Validity -->
          <tr>
            <td style="padding:0 30px 8px 30px; text-align:center;">
              <p style="margin:0; font-size:14px; color:#9a9a9a;">
                This code expires in <strong style="color:#e0e0e0;">10 minutes</strong>.
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 30px 30px 30px;">
              <p style="margin:0; font-size:13px; color:#777777; line-height:1.6; text-align:center;">
                Didn’t request this? You can safely ignore this email.<br>
                Never share this code with anyone.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#0f0f0f; padding:20px 30px; text-align:center; border-top:1px solid #2a2a2a;">
              <p style="margin:0; font-size:12px; color:#555555;">© 2026 StreamVault. All rights reserved.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
